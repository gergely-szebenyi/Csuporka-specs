schema: spec-driven

context: |
  Shared, cross-cutting specifications for Csuporka.
  Every spec here applies to both platforms: backend and mobile apps.
  Platform-specific behavior belongs in that platform's own spec store, never here.

rules:
  proposal:
    - Only propose a change here if it affects both platforms; otherwise move it to the platform's own store
  specs:
    - Describe shared behavior and contracts only, with no platform-specific implementation details