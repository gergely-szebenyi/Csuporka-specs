schema: shared-specs-only

context: |
  Shared, cross-cutting specifications for Csuporka (main specs + delta specs only).
  Every change targets at least two platforms (e.g. backend, mobile apps).
  No implementation lives here: no design.md, no tasks.md.
  Platform-specific behavior belongs in that platform's own spec store, never here.

rules:
  proposal:
    - Keep it short - what changes and why, no implementation details
    - Lead with whether it is a breaking change that all targeted platforms must migrate to
    - List every targeted platform; if only one, move the change to that platform's store
  specs:
    - Describe shared behavior and contracts only, with no platform-specific implementation details
    
operations:
  archive:
    guidance:
      - Before applying the delta, read this change's created date from .openspec.yaml. Find every change in openspec/changes/archive/ whose date prefix is on or after that date.
      - For each capability in this change's delta, collect its requirement names from ADDED, MODIFIED, REMOVED and RENAMED (both old and new names). Do the same for those archived changes.
      - If a name appears in both, another change touched that requirement after this one was written. Do not write anything yet. Show the archived change's version, the current main spec and this change's delta, propose a merged delta, and ask the user to confirm or choose. If the edits contradict each other, ask which behavior wins.
